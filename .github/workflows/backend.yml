name: Backend CI/CD - Azure Functions

on:
  push:
    branches:
      - master
    paths:
      - 'src/backend/**'
      - 'tests/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './src/backend/CatFactApp.Functions'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # --- KROK TESTÓW ---
      - name: Run Tests
        run: dotnet test --configuration Release --verbosity normal

      # --- WDROŻENIE (Uruchomi się tylko jeśli testy przejdą) ---
      - name: Publish Project
        shell: bash
        run: |
          dotnet publish ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }} --configuration Release --output ./publish

      - name: Zip Published Output
        shell: bash
        run: |
          cd ./publish
          zip -r ../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A3942F0766864F9E8210E48E48E6BC8D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ACC65BC56A064B738C925123D4A71BDB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DDE5DC1C093B4FAFA7821E68FD83BE47 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'catfactapp'
          slot-name: 'Production'
          package: './deploy.zip'